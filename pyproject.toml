[project]
name = "harness-it-all"
version = "0.1.0"
description = "Faire Vergleiche von LLM-Agenten: lokales Modell (crit) gegen Claude, mit festen Profilen, Aufzeichnung, Replay und Block-Bootstrap"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=0.80",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
]

[project.scripts]
harness-it-all = "harness_it_all.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness_it_all"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "B008"]  # deutsche Typografie; B008: typer.Option als Default

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: braucht eine laufende Engine oder einen API-Zugang; in CI abgewählt"]
addopts = "-m 'not network'"
